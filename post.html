    <script>
        // Update meta tags and schema for specific blog post
        function updatePostMeta(post) {
            const url = `https://kevinmto.github.io/beyond-gate/post.html?id=${post.id}`;
            
            // Update title
            document.title = `${post.title} - Beyond the Gate | Kevin Mato`;
            document.getElementById('post-page-title').textContent = post.title;
            
            // Update meta description
            const metaDesc = document.getElementById('post-meta-description');
            if (metaDesc) metaDesc.content = post.excerpt;
            
            // Update canonical
            const canonical = document.getElementById('post-canonical');
            if (canonical) canonical.href = url;
            
            // Update Open Graph
            const ogUrl = document.getElementById('post-og-url');
            const ogTitle = document.getElementById('post-og-title');
            const ogDesc = document.getElementById('post-og-description');
            if (ogUrl) ogUrl.content = url;
            if (ogTitle) ogTitle.content = post.title;
            if (ogDesc) ogDesc.content = post.excerpt;
            
            // Update Twitter
            const twUrl = document.getElementById('post-twitter-url');
            const twTitle = document.getElementById('post-twitter-title');
            const twDesc = document.getElementById('post-twitter-description');
            if (twUrl) twUrl.content = url;
            if (twTitle) twTitle.content = post.title;
            if (twDesc) twDesc.content = post.excerpt;
            
            // Update JSON-LD schema
            const schemaScript = document.getElementById('article-schema');
            if (schemaScript) {
                const schema = JSON.parse(schemaScript.textContent);
                const article = schema['@graph'].find(item => item['@type'] === 'BlogPosting');
                if (article) {
                    article.headline = post.title;
                    article.description = post.excerpt;
                    article.datePublished = post.date;
                    article.dateModified = post.date;
                    article['@id'] = url + '#article';
                    article.mainEntityOfPage['@id'] = url;
                    if (post.tags) {
                        article.keywords = post.tags;
                    }
                }
                // Update breadcrumb
                const breadcrumb = schema['@graph'].find(item => item['@type'] === 'BreadcrumbList');
                if (breadcrumb && breadcrumb.itemListElement[2]) {
                    breadcrumb.itemListElement[2].name = post.title;
                    breadcrumb.itemListElement[2].item = url;
                }
                schemaScript.textContent = JSON.stringify(schema);
            }
        }
        
        document.addEventListener('DOMContentLoaded', async function() {
            // Get post ID and fetch metadata first
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            
            if (postId) {
                try {
                    const response = await fetch('data/blog.json');
                    const data = await response.json();
                    const post = data.posts.find(p => p.id === postId);
                    if (post) {
                        updatePostMeta(post);
                    }
                } catch (e) {
                    console.error('Error loading post metadata:', e);
                }
            }
            
            loadBlogPost();
            loadSiteData();
        });
    </script>
