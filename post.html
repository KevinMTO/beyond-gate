<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blog post">
    <meta name="keywords" content="blog, engineering, technical">
    <title id="post-page-title">Blog Post - Engineer Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <a href="index.html" class="nav-brand">🚪 Beyond the Gate</a>
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="about.html" class="nav-link">About</a></li>
                    <li><a href="projects.html" class="nav-link">Projects</a></li>

                    <li><a href="contact.html" class="nav-link">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container">
        <!-- Back to blog link -->
        <div class="breadcrumb">
            <a href="blog.html">&larr; Back to Blog</a>
        </div>

        <!-- Blog post content - populated from blog.json based on URL parameter -->
        <article id="blog-post" class="blog-post">
            <div class="loading">Loading blog post...</div>

        <!-- Navigation to other posts -->
        <div id="post-navigation" class="post-navigation">
            <!-- Will be populated with previous/next post links -->
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 <span id="footer-name">Engineer</span>. All rights reserved.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadBlogPost();
            loadSiteData();
        });
    </script>
    
</body>
